[metadata]
# Configure specific project settings
name = MagneticControlLaw
version = 0.0.1
author = Griffin Tabor
author_email = griffin.tabor@utah.edu
description = 
url = 
license = MIT

# Configure general project settings
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Natural Language :: English
    Topic :: Scientific/Engineering :: Robotics
    License :: OSI Approved :: MIT License

# Change if running only on Windows, Mac or Linux (comma-separated)
platforms = any
[options]
install_requires =
    config-path
    pyyaml
    setuptools_scm>=6.2
    tqdm
    numpy
    torch
    scipy
    pybullet
    pyquaternion
    matplotlib
    ffmpeg
    PyYAML

zip_safe = False
packages = find:
package_dir =
    =src

include_package_data = True
python_requires = >=3.6

[options.packages.find]
where = src
exclude =
    test

[options.extras_require]
ci =
  anybadge
  black
  build
  flake8
  flake8-docstrings
  flake8-isort
  pytest
  pytest-cov
  sphinx
  sphinx_rtd_theme
  twine

dev =
  ipdb
  ipython
  jupyter

[flake8]
select = E,F,W,C,N
copyright-check = True
copyright-regexp = Copyright \(c\) 20\d{2}(?:-20\d{2})?, UNIVERSITY OF UTAH. All rights reserved.
max-line-length = 100
docstring-convention = google
exclude = .git, build, deprecated, SeperateAnalysis
#  W503: this is deprecated see: https://lintlyci.github.io/Flake8Rules/rules/W503.html
#  E203: to be Black compatible
#  E731: ignore recommendation to not use lambdas because there is no other way to write a single line function with out warnings
ignore = W503,E203,E731,F401,E741,E722,N817
ignore-names = R,T,I,J,Q,Lanc1,Lanc2,Lanc3,MOI,A,F,FT,TF,Ae,M,N,P